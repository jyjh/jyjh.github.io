{{ if .Params.comments | default true }}
<div class="giscus-comments" style="margin-top: 2rem;">
    <script>
        (function () {
            // giscus theme to use for each of the site's modes
            const themes = { light: "light", dark: "transparent_dark" };

            // Resolve the mode the same way light_dark.js does, since it may not have run yet
            const currentTheme = () => {
                const mode = localStorage.getItem("theme") ||
                    (document.body.classList.contains("dark-theme") ? "dark" : "light");
                return themes[mode] || themes.light;
            };

            const attributes = {
                "data-repo": "jyjh/jyjh.github.io-giscus",
                "data-repo-id": "R_kgDOVs147A",
                "data-category": "Announcements",
                "data-category-id": "DIC_kwDOVs147M4DLBxP",
                "data-mapping": "og:title",
                "data-strict": "1",
                "data-reactions-enabled": "1",
                "data-emit-metadata": "0",
                "data-input-position": "top",
                "data-theme": currentTheme(),
                "data-lang": "en",
                "data-loading": "lazy",
                "crossorigin": "anonymous"
            };

            const script = document.createElement("script");
            script.src = "https://giscus.app/client.js";
            script.async = true;
            Object.entries(attributes).forEach(([name, value]) => script.setAttribute(name, value));
            document.currentScript.parentElement.appendChild(script);

            const syncTheme = () => {
                const frame = document.querySelector("iframe.giscus-frame");
                if (!frame) return;
                frame.contentWindow.postMessage(
                    { giscus: { setConfig: { theme: currentTheme() } } },
                    "https://giscus.app"
                );
            };

            // Follow the sidebar light/dark toggle, which flips the dark-theme class on <body>
            new MutationObserver(syncTheme).observe(document.body, {
                attributes: true,
                attributeFilter: ["class"]
            });

            // The iframe loads lazily, so re-sync once it is ready in case the toggle was used before then
            window.addEventListener("message", function onReady(event) {
                if (event.origin !== "https://giscus.app") return;
                window.removeEventListener("message", onReady);
                syncTheme();
            });
        })();
    </script>
</div>
{{ end }}
