  <path fill="#6a538c" opacity=".8" d="M0 640 L120 600 L260 660 L400 590 L560 655 L720 610 L900 668 L1060 600 L1220 660 L1380 615 L1600 655 L1600 900 L0 900 Z"/>
  <path fill="#493a67" opacity=".92" d="M0 726 L150 664 L330 734 L520 648 L700 728 L880 668 L1080 738 L1280 658 L1450 724 L1600 684 L1600 900 L0 900 Z"/>
  <path fill="#2b2347" d="M0 804 L200 744 L380 814 L560 738 L760 818 L960 752 L1180 822 L1400 758 L1600 812 L1600 900 L0 900 Z"/>
  <rect x="0" y="700" width="1600" height="80" fill="#ecab8f" opacity=".14" filter="url(#soft)"/>
