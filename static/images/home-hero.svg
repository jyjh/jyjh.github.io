<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- PLACEHOLDER homepage art (dusk over layered mountains).
       Replace this file with your own artwork (svg/png/jpg/webp) and update
       home_hero_image in hugo.toml if the filename changes. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141d3d"/>
      <stop offset=".42" stop-color="#4b3d68"/>
      <stop offset=".72" stop-color="#b4687f"/>
      <stop offset="1" stop-color="#eb9e7c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd9a3" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd9a3" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#ffe9d6">
    <circle cx="150" cy="120" r="1.6" opacity=".7"/><circle cx="300" cy="82" r="1.2" opacity=".5"/>
    <circle cx="480" cy="160" r="1.4" opacity=".6"/><circle cx="640" cy="92" r="1" opacity=".45"/>
    <circle cx="820" cy="142" r="1.5" opacity=".65"/><circle cx="980" cy="70" r="1.1" opacity=".4"/>
    <circle cx="1180" cy="122" r="1.3" opacity=".5"/><circle cx="1320" cy="62" r="1.6" opacity=".7"/>
    <circle cx="1480" cy="180" r="1.2" opacity=".45"/><circle cx="220" cy="240" r="1" opacity=".35"/>
    <circle cx="560" cy="262" r="1.3" opacity=".4"/><circle cx="1380" cy="262" r="1.1" opacity=".35"/>
    <circle cx="760" cy="304" r="1" opacity=".3"/><circle cx="1240" cy="222" r="1.4" opacity=".5"/>
  </g>
  <circle cx="1060" cy="600" r="210" fill="url(#glow)"/>
  <circle cx="1060" cy="600" r="72" fill="#ffd9a4" filter="url(#soft)" opacity=".9"/>
  <circle cx="1060" cy="600" r="48" fill="#ffe3b4"/>
  <g fill="#f2b092" filter="url(#soft)">
    <ellipse cx="400" cy="380" rx="170" ry="16" opacity=".22"/>
    <ellipse cx="880" cy="330" rx="200" ry="18" opacity=".18"/>
    <ellipse cx="1320" cy="420" rx="150" ry="14" opacity=".2"/>
